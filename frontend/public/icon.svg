<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Grid lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#1f293d" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1f293d" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <line x1="80" y1="380" x2="432" y2="380" stroke="#1f293d" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Candlesticks in Background -->
  <!-- Candle 1 -->
  <line x1="130" y1="260" x2="130" y2="390" stroke="#475569" stroke-width="3" />
  <rect x="120" y="290" width="20" height="60" rx="4" fill="#ef4444" opacity="0.75" />

  <!-- Candle 2 -->
  <line x1="210" y1="210" x2="210" y2="360" stroke="#475569" stroke-width="3" />
  <rect x="200" y="240" width="20" height="80" rx="4" fill="#10b981" opacity="0.75" />

  <!-- Candle 3 -->
  <line x1="290" y1="170" x2="290" y2="320" stroke="#475569" stroke-width="3" />
  <rect x="280" y="200" width="20" height="70" rx="4" fill="#10b981" opacity="0.75" />

  <!-- Candle 4 -->
  <line x1="370" y1="110" x2="370" y2="260" stroke="#475569" stroke-width="3" />
  <rect x="360" y="140" width="20" height="85" rx="4" fill="#38bdf8" opacity="0.9" />

  <!-- Dynamic Trend Curve Area Fill -->
  <path d="M 80 380 L 130 350 L 210 270 L 290 220 L 370 140 L 432 90 L 432 420 L 80 420 Z" fill="url(#glowGrad)" />

  <!-- Dynamic Trend Line -->
  <path d="M 80 380 Q 150 350 210 270 T 370 140 L 432 90" fill="none" stroke="url(#chartGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Indicator Pulse Dot at Peak -->
  <circle cx="432" cy="90" r="16" fill="#38bdf8" />
  <circle cx="432" cy="90" r="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
</svg>
